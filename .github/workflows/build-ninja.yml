name: Build SSAB (Ninja fallback)

# Fallback workflow that uses the Ninja generator with MSVC directly
# (no Visual Studio solution needed). Use this if build.yml fails with
# "could not find any instance of Visual Studio".
#
# This workflow uses vswhere to auto-discover the VS installation path,
# so it works regardless of whether the runner has VS 17, VS 18, or any
# future version.
#
# To use: Actions tab → "Build SSAB (Ninja fallback)" → Run workflow.
on:
  workflow_dispatch:

jobs:
  build-windows-ninja:
    name: Build on Windows (Ninja + MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ----------------------------------------------------------------
      # 1. Setup MSVC environment via setup-msbuild (auto-detect VS).
      # ----------------------------------------------------------------
      - name: Setup MSVC dev environment
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ----------------------------------------------------------------
      # 2. Install Ninja (single-binary, very portable).
      # ----------------------------------------------------------------
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: '1.11.1'

      - name: Print tool versions + find VS
        shell: pwsh
        run: |
          Write-Host "=== CMake ==="
          cmake --version
          Write-Host ""
          Write-Host "=== Ninja ==="
          ninja --version
          Write-Host ""
          Write-Host "=== MSBuild ==="
          msbuild -version
          Write-Host ""
          Write-Host "=== VS installation (via vswhere) ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath
            Write-Host "Installation path: $vsPath"
            # Save the path for the next step
            "VSPATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # ----------------------------------------------------------------
      # 3. Configure with Ninja generator + MSVC compiler.
      #    We need to call vcvars64.bat to set up the MSVC environment
      #    (cl.exe, INCLUDE, LIB, etc.). The path to vcvars64.bat is
      #    discovered in the previous step via vswhere.
      # ----------------------------------------------------------------
      - name: Configure (CMake + Ninja)
        shell: cmd
        run: |
          echo Using VS path: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSAB_ENABLE_VST2=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build (Release)
        shell: cmd
        run: |
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --parallel

      - name: List artefacts
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Include *.dll,*.vst3,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Found: $($_.FullName) ($($_.Length) bytes)" }

      - name: Stage artefacts
        shell: pwsh
        run: |
          $out = "staging"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $vst = Get-ChildItem -Path build -Recurse -Filter "SSAB.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vst) { Copy-Item $vst.FullName -Destination "$out/SSAB.dll" }
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "SSAB.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vst3) {
            New-Item -ItemType Directory -Force -Path "$out/SSAB.vst3" | Out-Null
            Copy-Item -Path "$($vst3.FullName)/*" -Destination "$out/SSAB.vst3" -Recurse -Force
          }
          $exe = Get-ChildItem -Path build -Recurse -Filter "SSAB.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination "$out/SSAB.exe" }
          Compress-Archive -Path staging/* -DestinationPath SSAB_windows_build.zip -Force
          Get-ChildItem -Path staging -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Upload VST2 .dll (for LMMS)
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_VST2_dll_ninja
          path: staging/SSAB.dll
          if-no-files-found: warn

      - name: Upload full zip
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_windows_build_zip_ninja
          path: SSAB_windows_build.zip
          if-no-files-found: warn
