name: Diagnose Runner

# Manual workflow that prints what's installed on the Windows runner.
# Use this if build.yml and build-ninja.yml both fail — the output will
# show exactly what compilers / CMake / VS installations are available,
# and tries to actually configure the project with the auto-detected
# generator (using $LASTEXITCODE, not try/catch which masks cmake errors).
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Print Windows runner environment
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print environment
        shell: pwsh
        run: |
          Write-Host "=== OS ==="
          Get-ComputerInfo | Select-Object OsName, OsVersion, OsArchitecture
          Write-Host ""
          Write-Host "=== CMake (default) ==="
          cmake --version
          Write-Host ""
          Write-Host "=== Where is cmake ==="
          Get-Command cmake -ErrorAction SilentlyContinue | Format-List
          Write-Host ""
          Write-Host "=== Where is msbuild ==="
          Get-Command msbuild -ErrorAction SilentlyContinue | Format-List
          Write-Host ""
          Write-Host "=== Visual Studio installations (vswhere) ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "All VS installations:"
            & $vswhere -all -format json | ConvertFrom-Json | ForEach-Object {
              Write-Host "  Instance: $($_.installationPath)"
              Write-Host "    Version: $($_.installationVersion)"
              Write-Host "    DisplayName: $($_.displayName)"
              Write-Host "    ProductDisplayVersion: $($_.catalog_productDisplayVersion)"
            }
            Write-Host ""
            Write-Host "Latest VS:"
            $latest = & $vswhere -latest -format json | ConvertFrom-Json
            Write-Host "  Path:    $($latest.installationPath)"
            Write-Host "  Version: $($latest.installationVersion)"
            $vsMajor = [int]::Parse($latest.installationVersion.Split('.')[0])
            Write-Host "  Major:   $vsMajor"
          } else {
            Write-Host "vswhere.exe not found!"
          }
          Write-Host ""
          Write-Host "=== CMake generators available (filtered) ==="
          cmake --help | Select-String -Pattern "^\s+(Visual Studio|Ninja|Unix Makefiles|MSYS|Borland|NMake)" | ForEach-Object { Write-Host $_.Line }

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ------------------------------------------------------------------
      # Try to configure the project using the auto-detected generator.
      # We check $LASTEXITCODE (NOT try/catch) because cmake prints errors
      # to stderr but still returns 0 from the PowerShell process.
      # ------------------------------------------------------------------
      - name: Test CMake configure with auto-detected generator
        shell: pwsh
        run: |
          Write-Host "=== After setup-msbuild ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsVersion = & $vswhere -latest -property installationVersion
          $vsMajor   = [int]::Parse($vsVersion.Split('.')[0])
          Write-Host "Detected VS version: $vsVersion (major=$vsMajor)"
          Write-Host ""

          # Explicit map — Microsoft breaks the "+2005" pattern at VS 18.
          $yearMap = @{
              14 = 2015
              15 = 2017
              16 = 2019
              17 = 2022
              18 = 2026
              19 = 2029
              20 = 2032
          }
          if ($yearMap.ContainsKey($vsMajor)) {
              $vsYear = $yearMap[$vsMajor]
          } else {
              $vsYear = $vsMajor + 2005
              Write-Host "WARNING: VS major $vsMajor not in known map. Guessing $vsYear." -ForegroundColor Yellow
          }
          $genName = "Visual Studio $vsMajor $vsYear"
          Write-Host "Trying generator: $genName"
          Write-Host ""

          # Sanity check: does CMake actually list this generator?
          $helpOutput = cmake --help | Out-String
          if ($helpOutput -notmatch [regex]::Escape($genName)) {
              Write-Host "Generator '$genName' is NOT listed by cmake --help." -ForegroundColor Yellow
              Write-Host "Trying fallback: Visual Studio 17 2022"
              $genName = "Visual Studio 17 2022"
              if ($helpOutput -notmatch [regex]::Escape($genName)) {
                  Write-Host "VS 2022 generator also missing." -ForegroundColor Yellow
                  Write-Host "Diagnosis complete: cannot find any VS generator." -ForegroundColor Red
                  exit 1
              }
          }
          Write-Host "Confirmed: generator '$genName' is listed by CMake." -ForegroundColor Green
          Write-Host ""

          Write-Host "=== Running: cmake -S . -B test_build -G `"$genName`" -A x64 ==="
          & cmake -S . -B test_build -G "$genName" -A x64
          $cmakeExit = $LASTEXITCODE
          Write-Host ""
          Write-Host "CMake exit code: $cmakeExit"
          if ($cmakeExit -ne 0) {
              Write-Host "FAILED: CMake configure with $genName." -ForegroundColor Red
              exit 1
          }
          Write-Host "SUCCESS: CMake configured with $genName" -ForegroundColor Green
