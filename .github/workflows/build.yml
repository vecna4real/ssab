name: Build SSAB VST2/VST3

# Triggers:
#   - push to main/master: build on Windows
#   - tag v*.*.*: build + publish a GitHub Release with the .dll
#   - workflow_dispatch: manual run from the Actions tab
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows (VST2 + VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ----------------------------------------------------------------
      # 1. Set up the Microsoft Visual C++ build environment.
      #    DON'T pin vs-version — let it find whatever VS is on the runner.
      #    On windows-latest as of late 2025 this is VS 18 (2026 Preview),
      #    but it could change. setup-msbuild handles this automatically.
      # ----------------------------------------------------------------
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ----------------------------------------------------------------
      # 2. Print tool versions and find VS installation path.
      # ----------------------------------------------------------------
      - name: Print tool versions + find VS
        shell: pwsh
        run: |
          Write-Host "=== CMake version ==="
          cmake --version
          Write-Host ""
          Write-Host "=== MSBuild version ==="
          msbuild -version
          Write-Host ""
          Write-Host "=== Visual Studio installations (vswhere) ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -property installationPath
            Write-Host "VS version:"
            & $vswhere -latest -property installationVersion
            Write-Host "VS catalog:"
            & $vswhere -latest -property catalog_productDisplayVersion
          } else {
            Write-Host "vswhere.exe not found!"
          }
          Write-Host ""
          Write-Host "=== Available CMake generators ==="
          cmake --help | Select-String -Pattern "^\s+(Visual Studio|Ninja|Unix Makefiles|MSYS)" | ForEach-Object { Write-Host $_.Line }

      # ----------------------------------------------------------------
      # 3. Configure CMake with AUTO-DETECT generator.
      #    We do NOT pass -G "Visual Studio 17 2022" because:
      #      - On old runners: it works.
      #      - On windows-latest (2025+): VS 17 is gone, only VS 18
      #        exists. The "Visual Studio 17 2022" generator then fails
      #        with "could not find any instance of Visual Studio".
      #
      #    Instead we use vswhere to discover the VS major version
      #    installed, then build the generator name dynamically.
      # ----------------------------------------------------------------
      - name: Configure (CMake with auto-detected VS generator)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsVersion = & $vswhere -latest -property installationVersion
          $vsMajor = $vsVersion.Split('.')[0]
          Write-Host "Detected Visual Studio major version: $vsMajor"
          Write-Host "Full version: $vsVersion"

          # Map VS major -> CMake generator name
          # VS 17 = "Visual Studio 17 2022"
          # VS 18 = "Visual Studio 18 2026" (preview)
          # VS 19+ = future, hopefully follows the pattern
          $genName = "Visual Studio $vsMajor $([int]::Parse($vsMajor) + 2005)"
          Write-Host "Using generator: $genName"

          mkdir build -Force
          cd build
          cmake .. -G "$genName" -A x64 -DSSAB_ENABLE_VST2=ON

      # ----------------------------------------------------------------
      # 4. Build (Release).
      #    --parallel lets MSBuild use all cores.
      # ----------------------------------------------------------------
      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      # ----------------------------------------------------------------
      # 5. List artefacts so we can see what was produced.
      # ----------------------------------------------------------------
      - name: List artefacts
        shell: pwsh
        run: |
          Write-Host "=== Searching for build artefacts ==="
          Get-ChildItem -Path build -Recurse -Include *.dll,*.vst3,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "Found: $($_.FullName) ($($_.Length) bytes)"
            }

      # ----------------------------------------------------------------
      # 6. Stage artefacts for upload.
      # ----------------------------------------------------------------
      - name: Stage artefacts
        shell: pwsh
        run: |
          $out = "staging"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # VST2 .dll
          $vst = Get-ChildItem -Path build -Recurse -Filter "SSAB.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vst) {
            Copy-Item $vst.FullName -Destination "$out/SSAB.dll"
            Write-Host "Staged VST2: $($vst.FullName)"
          } else {
            Write-Host "WARNING: SSAB.dll not found!"
          }

          # VST3 bundle
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "SSAB.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vst3) {
            New-Item -ItemType Directory -Force -Path "$out/SSAB.vst3" | Out-Null
            Copy-Item -Path "$($vst3.FullName)/*" -Destination "$out/SSAB.vst3" -Recurse -Force
            Write-Host "Staged VST3: $($vst3.FullName)"
          }

          # Standalone exe
          $exe = Get-ChildItem -Path build -Recurse -Filter "SSAB.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "$out/SSAB.exe"
            Write-Host "Standalone: $($exe.FullName)"
          }

          Write-Host "=== Staged files ==="
          Get-ChildItem -Path $out -Recurse | ForEach-Object { Write-Host $_.FullName }

      # ----------------------------------------------------------------
      # 7. Upload artefacts (each as separate downloadable item).
      # ----------------------------------------------------------------
      - name: Upload VST2 .dll (for LMMS)
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_VST2_dll
          path: staging/SSAB.dll
          if-no-files-found: warn
          retention-days: 90

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_VST3
          path: staging/SSAB.vst3
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_Standalone
          path: staging/SSAB.exe
          if-no-files-found: warn
          retention-days: 90

      # ----------------------------------------------------------------
      # 8. Zip everything for a one-click download.
      # ----------------------------------------------------------------
      - name: Zip everything
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* -DestinationPath SSAB_windows_build.zip -Force

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_windows_build_zip
          path: SSAB_windows_build.zip
          if-no-files-found: warn
          retention-days: 90

  # ------------------------------------------------------------------
  # Release: when a v*.*.* tag is pushed, attach the zip to a release.
  # ------------------------------------------------------------------
  release:
    name: Release on tag
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zip artefact
        uses: actions/download-artifact@v4
        with:
          name: SSAB_windows_build_zip
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
