name: Build SSAB VST2/VST3

# Triggers:
#   - push to main/master: build on Windows
#   - tag v*.*.*: build + publish a GitHub Release with the .dll
#   - workflow_dispatch: manual run from the Actions tab
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows (VST2 + VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ----------------------------------------------------------------
      # 1. Set up the Microsoft Visual C++ build environment.
      #    Don't pin vs-version — let it auto-detect.
      # ----------------------------------------------------------------
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ----------------------------------------------------------------
      # 2. Discover installed Visual Studio + pick the correct CMake
      #    generator name. Microsoft doesn't follow a strict
      #    "major + offset" naming convention, so we use an explicit
      #    map: VS 17 -> 2022, VS 18 -> 2026, etc. We also query
      #    `cmake --help` and pick the matching generator from what
      #    CMake actually supports on this runner.
      # ----------------------------------------------------------------
      - name: Detect Visual Studio and CMake generator
        id: detect
        shell: pwsh
        run: |
          Write-Host "=== CMake version ==="
          cmake --version
          Write-Host ""
          Write-Host "=== MSBuild version ==="
          msbuild -version
          Write-Host ""

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "FATAL: vswhere.exe not found." -ForegroundColor Red
            exit 1
          }

          $vsPath    = & $vswhere -latest -property installationPath
          $vsVersion  = & $vswhere -latest -property installationVersion
          $vsMajor    = [int]::Parse($vsVersion.Split('.')[0])
          $vsYear     = $null

          # Known VS major -> year mapping.
          # Microsoft breaks the "major + 2005" pattern starting at VS 18.
          $yearMap = @{
            14 = 2015
            15 = 2017
            16 = 2019
            17 = 2022
            18 = 2026
            19 = 2029  # educated guess for future VS
            20 = 2032
          }
          if ($yearMap.ContainsKey($vsMajor)) {
            $vsYear = $yearMap[$vsMajor]
          } else {
            # Fallback: try major + 2005
            $vsYear = $vsMajor + 2005
          }
          $genName = "Visual Studio $vsMajor $vsYear"
          Write-Host "Detected VS path:    $vsPath"
          Write-Host "Detected VS version: $vsVersion"
          Write-Host "VS major:            $vsMajor"
          Write-Host "VS year:             $vsYear"
          Write-Host "Candidate generator: $genName"
          Write-Host ""

          # Sanity-check: does CMake actually know this generator?
          $helpOutput = cmake --help | Out-String
          if ($helpOutput -notmatch [regex]::Escape($genName)) {
            Write-Host "WARNING: CMake does not list generator '$genName'." -ForegroundColor Yellow
            Write-Host "Trying fallback: Visual Studio 17 2022"
            $genName = "Visual Studio 17 2022"
            if ($helpOutput -notmatch [regex]::Escape($genName)) {
              Write-Host "WARNING: VS 2022 generator also missing. Using Ninja." -ForegroundColor Yellow
              $genName = "Ninja"
            }
          }
          Write-Host "Selected generator:  $genName" -ForegroundColor Cyan

          # Save for next step (as step output + env var).
          "GEN_NAME=$genName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Final: GEN_NAME=$genName"

      # ----------------------------------------------------------------
      # 3. Configure CMake with the discovered generator.
      #    Ninja is a single-config generator (no -A flag, no --config).
      #    VS generators are multi-config (-A x64 + --config Release).
      # ----------------------------------------------------------------
      - name: Configure (CMake)
        shell: pwsh
        run: |
          Write-Host "Using generator: $env:GEN_NAME"
          if ($env:GEN_NAME -eq "Ninja") {
            & cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DSSAB_ENABLE_VST2=ON
          } else {
            & cmake -S . -B build -G "$env:GEN_NAME" -A x64 -DSSAB_ENABLE_VST2=ON
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: CMake configure failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }

      # ----------------------------------------------------------------
      # 4. Build (Release).
      #    For Ninja (single-config), we omit --config since
      #    CMAKE_BUILD_TYPE=Release is already set.
      # ----------------------------------------------------------------
      - name: Build (Release)
        shell: pwsh
        run: |
          if ($env:GEN_NAME -eq "Ninja") {
            & cmake --build build --parallel
          } else {
            & cmake --build build --config Release --parallel
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Build failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }

      # ----------------------------------------------------------------
      # 5. List artefacts.
      # ----------------------------------------------------------------
      - name: List artefacts
        shell: pwsh
        run: |
          Write-Host "=== Searching for build artefacts ==="
          Get-ChildItem -Path build -Recurse -Include *.dll,*.vst3,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "Found: $($_.FullName) ($($_.Length) bytes)"
            }

      # ----------------------------------------------------------------
      # 6. Stage artefacts for upload.
      # ----------------------------------------------------------------
      - name: Stage artefacts
        shell: pwsh
        run: |
          $out = "staging"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $vst = Get-ChildItem -Path build -Recurse -Filter "SSAB.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vst) {
            Copy-Item $vst.FullName -Destination "$out/SSAB.dll"
            Write-Host "Staged VST2: $($vst.FullName)"
          } else {
            Write-Host "WARNING: SSAB.dll not found!"
          }

          $vst3 = Get-ChildItem -Path build -Recurse -Filter "SSAB.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vst3) {
            New-Item -ItemType Directory -Force -Path "$out/SSAB.vst3" | Out-Null
            Copy-Item -Path "$($vst3.FullName)/*" -Destination "$out/SSAB.vst3" -Recurse -Force
            Write-Host "Staged VST3: $($vst3.FullName)"
          }

          $exe = Get-ChildItem -Path build -Recurse -Filter "SSAB.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "$out/SSAB.exe"
            Write-Host "Standalone: $($exe.FullName)"
          }

          Write-Host "=== Staged files ==="
          Get-ChildItem -Path $out -Recurse | ForEach-Object { Write-Host $_.FullName }

      # ----------------------------------------------------------------
      # 7. Upload artefacts.
      # ----------------------------------------------------------------
      - name: Upload VST2 .dll (for LMMS)
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_VST2_dll
          path: staging/SSAB.dll
          if-no-files-found: warn
          retention-days: 90

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_VST3
          path: staging/SSAB.vst3
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_Standalone
          path: staging/SSAB.exe
          if-no-files-found: warn
          retention-days: 90

      - name: Zip everything
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* -DestinationPath SSAB_windows_build.zip -Force

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: SSAB_windows_build_zip
          path: SSAB_windows_build.zip
          if-no-files-found: warn
          retention-days: 90

  # ------------------------------------------------------------------
  # Release: when a v*.*.* tag is pushed, attach the zip to a release.
  # ------------------------------------------------------------------
  release:
    name: Release on tag
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zip artefact
        uses: actions/download-artifact@v4
        with:
          name: SSAB_windows_build_zip
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
